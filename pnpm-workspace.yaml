# pnpm settings for this (single-package) project.
# Only install package versions that have been public for at least 3 days.
minimumReleaseAge: 4320

# Dependency install scripts are not allowed. These two ship prebuilt binaries
# and work without their postinstall step; denying them explicitly keeps
# `pnpm install` (incl. Cloudflare Workers Builds) from failing on them.
allowBuilds:
  esbuild: false
  workerd: false
